[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
authors = [
  { name = "Local", email = "admin@example.com" }
]
description = "Astra is a local, permission-aware AI chat assistant for Frappe Desk."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
classifiers = [
  "Framework :: Frappe",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14"
]

[tool.setuptools.dynamic]
version = { attr = "astra.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["astra*"]
